name: Notion 图片自动修复

on:
  # 1. 定时执行：每天北京时间 02:00 (UTC 18:00)
  schedule:
    - cron: '0 18 * * *'
  
  # 2. 手动触发
  workflow_dispatch:
  
  # 3. (可选) 有新 push 时也触发
  # push:
  #   branches: [ main ]

jobs:
  fix-notion-images:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
    
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 运行图片修复脚本
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        DATABASE_ID: ${{ secrets.DATABASE_ID }}
      run: |
        python notion_image_fixer.py
    
    - name: 上传日志 (可选)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: notion-image-fixer-logs
        path: |
          *.log
        retention-days: 7
