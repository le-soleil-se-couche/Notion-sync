name: Notion Full Recovery Pipeline

on:
  # 定时执行：每天北京时间 02:00 (UTC 18:00)
  schedule:
    - cron: '0 18 * * *'
  
  # 手动触发
  workflow_dispatch:

jobs:
  full-recovery:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
    
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    # 刷新 Google OAuth Token，并自动更新 GitHub Secret（需配置 GH_PAT）
    # 若 GH_PAT 未配置，刷新后的 token 仍会通过 GITHUB_ENV 传递给后续步骤，
    # 但不会写回 Secret，下次运行仍需手动更新。
    - name: 刷新 Google OAuth Token
      env:
        GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        GH_TOKEN: ${{ secrets.GH_PAT }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        NEW_TOKEN=$(python refresh_google_token.py)
        if [ -n "$NEW_TOKEN" ]; then
          DELIMITER=$(openssl rand -hex 8)
          echo "GOOGLE_TOKEN_JSON<<${DELIMITER}" >> "$GITHUB_ENV"
          echo "$NEW_TOKEN"                      >> "$GITHUB_ENV"
          echo "${DELIMITER}"                    >> "$GITHUB_ENV"
        fi
    
    # Step 1: 图片永久化 (修复外部链接)
    - name: 运行图片修复脚本
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        DATABASE_ID: ${{ secrets.DATABASE_ID }}
        NOTION_TOKEN_V2: ${{ secrets.NOTION_TOKEN_V2 }}
      run: |
        python notion_image_fixer.py
    
    # Step 2: 同步到 Google Drive
    - name: 运行同步脚本
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        DATABASE_ID: ${{ secrets.DATABASE_ID }}
        NOTION_TOKEN_V2: ${{ secrets.NOTION_TOKEN_V2 }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        GOOGLE_TOKEN_JSON: ${{ env.GOOGLE_TOKEN_JSON || secrets.GOOGLE_TOKEN_JSON }}
      run: |
        python notion_to_drive_sync.py
    
    - name: 上传日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recovery-logs-${{ github.run_id }}
        path: |
          *.log
        retention-days: 7
